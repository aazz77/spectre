[package]
name = "spectre-proto"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Spectre proxy protocol core: wire format, Brutal congestion control, JLS obfuscation helpers, and UDP framing"
license = "MIT"
repository = "https://github.com/minexxa/spectre"
keywords = ["quic", "proxy", "protocol", "jls", "brutal"]
categories = ["network-programming"]
readme = "README.md"
documentation = "https://docs.rs/spectre-protocol"

[dependencies]
# JLS-enabled QUIC / TLS stacks (required by Brutal + ObfsRuntime)
quinn-jls = { version = "0.3", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
quinn-proto-jls = { version = "0.3", default-features = false }
socket2 = { version = ">=0.5, <0.7", features = ["all"] }

bytes = "1"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "macros", "rt"] }
dashmap = "6"
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
